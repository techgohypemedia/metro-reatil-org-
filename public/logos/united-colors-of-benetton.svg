    <text x="0" y="24" font-family="'Gill Sans', 'Trebuchet MS', 'Arial Black', sans-serif" font-weight="900" font-size="16" letter-spacing="1.2">UNITED COLORS</text>
    <text x="0" y="44" font-family="'Gill Sans', 'Trebuchet MS', 'Arial Black', sans-serif" font-weight="900" font-size="16" letter-spacing="1.2">OF BENETTON.</text>

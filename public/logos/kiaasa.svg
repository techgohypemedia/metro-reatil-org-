<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 70" width="240" height="70">
  <!-- Official Kiaasa Red Background Badge -->
  <rect width="240" height="70" rx="4" fill="#D20D27"/>
  
  <g transform="translate(20, 8)">
    <!-- Flower/Lotus Motif Crown positioned perfectly over the 'I' -->
    <g transform="translate(42, 6)">
      <!-- Left golden petal -->
      <path d="M0 14 C-6 13 -11 8 -10 1 C-9 6 -5 11 0 14 Z" fill="#EDA433"/>
      <path d="M0 14 C-4 13 -9 9 -10 1 C-6 2 -2 7 0 14 Z" fill="#D88A18"/>
      <!-- Right golden petal -->
      <path d="M0 14 C6 13 11 8 10 1 C9 6 5 11 0 14 Z" fill="#EDA433"/>
      <path d="M0 14 C4 13 9 9 10 1 C6 2 2 7 0 14 Z" fill="#D88A18"/>
      <!-- Center white droplet/petal -->
      <path d="M0 0 C-3 4 -3.5 8 0 12 C3.5 8 3 4 0 0 Z" fill="#FFFFFF"/>
    </g>
    
    <!-- KIAASA Typography -->
    <text x="100" y="38" text-anchor="middle" font-family="'Times New Roman', 'Cinzel', 'Playfair Display', 'Georgia', serif" font-weight="700" font-size="27" fill="#FFFFFF" letter-spacing="4">KIAASA</text>
  </g>
</svg>
